<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Remito con IA</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
        button, input { width: 100%; padding: 10px; margin-top: 10px; font-size: 16px; }
        #resultado { margin-top: 20px; padding: 10px; background: #e9ecef; min-height: 100px; border-radius: 5px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>Lector IA de Remitos</h2>
    
    <!-- Aquí pondrás tu llave privada -->
    <input type="password" id="apiKey" placeholder="Pega aquí tu API Key de Gemini">
    
    <!-- Este input abre la cámara en el celular -->
    <input type="file" id="fotoRemito" accept="image/*" capture="environment">
    
    <button onclick="procesarImagen()">Analizar Remito</button>

    <div id="resultado">Esperando imagen...</div>
</div>

<script>
    async function procesarImagen() {
        const apiKey = document.getElementById('apiKey').value;
        const fileInput = document.getElementById('fotoRemito');
        const resultadoDiv = document.getElementById('resultado');

        if (!apiKey || fileInput.files.length === 0) {
            alert("Falta la API Key o la foto.");
            return;
        }

        resultadoDiv.innerHTML = "⏳ La IA está leyendo el remito, por favor espera...";

        // 1. Convertir la imagen a Base64 (formato que entiende la IA)
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];

            // 2. Preparar el Prompt y el envío de datos
            const payload = {
                contents: [{
                    parts: [
                        { text: "Analiza este remito de entrega. Extrae los nombres de los productos y sus cantidades originales. Si son empanadas, divide la cantidad entre 30 para obtener los cajones. Si son burritos, divide entre 14. Devuelve el resultado en una lista clara, sin texto adicional." },
                        { inline_data: { mime_type: file.type, data: base64Image } }
                    ]
                }]
            };

            // 3. Conectarse a Gemini
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                // 4. Mostrar el resultado
                if (data.candidates && data.candidates.length > 0) {
                    resultadoDiv.innerHTML = data.candidates[0].content.parts[0].text;
                } else {
                    resultadoDiv.innerHTML = "Error: La IA no pudo leer la imagen.";
                }
            } catch (error) {
                resultadoDiv.innerHTML = "Error de conexión: " + error.message;
            }
        }
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
