<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Remito con IA</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
        button, input { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc;}
        #btn-analizar { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        #btn-modelos { background: #ff9800; color: white; border: none; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #resultado { margin-top: 20px; padding: 15px; background: #333; color: #0f0; min-height: 100px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; font-size: 13px;}
    </style>
</head>
<body>

<div class="container">
    <h2>Lector IA (Auto-Reparación)</h2>
    
    <input type="password" id="apiKey" placeholder="Pega aquí tu API Key de Gemini">
    <input type="file" id="fotoRemito" accept="image/*" capture="environment">
    
    <button id="btn-analizar" onclick="procesarImagen()">1. Analizar Remito</button>
    <button id="btn-modelos" onclick="listarModelos()">2. Ver Modelos (Si falla el paso 1)</button>

    <div id="resultado">Esperando acción...</div>
</div>

<script>
    async function procesarImagen() {
        const apiKey = document.getElementById('apiKey').value.trim(); 
        const fileInput = document.getElementById('fotoRemito');
        const resultadoDiv = document.getElementById('resultado');

        if (!apiKey || fileInput.files.length === 0) {
            alert("Falta la API Key o la foto del remito.");
            return;
        }

        resultadoDiv.style.background = "#333";
        resultadoDiv.style.color = "#0f0";
        resultadoDiv.innerHTML = "⏳ Intentando con la versión oficial (v1)...";

        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];

            const payload = {
                contents: [{
                    parts: [
                        { text: "Analiza este remito de entrega. Extrae los nombres de los productos y sus cantidades originales. Si son empanadas, divide la cantidad entre 30 para obtener los cajones. Si son burritos, divide entre 14. Devuelve el resultado en una lista clara, sin texto adicional." },
                        { inline_data: { mime_type: file.type, data: base64Image } }
                    ]
                }]
            };

            try {
                // Cambiamos a v1 (versión oficial) y regresamos al nombre base
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok && data.candidates && data.candidates.length > 0) {
                    resultadoDiv.style.background = "#e9ecef";
                    resultadoDiv.style.color = "#000";
                    resultadoDiv.innerHTML = data.candidates[0].content.parts[0].text;
                } else {
                    resultadoDiv.style.background = "#333";
                    resultadoDiv.style.color = "#ff4444";
                    resultadoDiv.innerHTML = "ERROR DETALLADO:\n" + JSON.stringify(data, null, 2) + "\n\n👉 POR FAVOR TOCA EL BOTÓN NARANJA '2. Ver Modelos'";
                }
            } catch (error) {
                resultadoDiv.style.background = "#333";
                resultadoDiv.style.color = "#ff4444";
                resultadoDiv.innerHTML = "Error de conexión: " + error.message;
            }
        }
        reader.readAsDataURL(file);
    }

    // Esta función le pregunta directamente a Google qué modelos están habilitados
    async function listarModelos() {
        const apiKey = document.getElementById('apiKey').value.trim(); 
        const resultadoDiv = document.getElementById('resultado');
        
        if (!apiKey) {
            alert("Por favor, pega tu API Key primero.");
            return;
        }

        resultadoDiv.style.background = "#333";
        resultadoDiv.style.color = "#0f0";
        resultadoDiv.innerHTML = "🔍 Consultando directamente a Google los modelos compatibles...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
            const data = await response.json();
            
            if (data.models) {
                const nombres = data.models.map(m => m.name).join('\n');
                resultadoDiv.style.color = "#00bcd4";
                resultadoDiv.innerHTML = "✅ MODELOS HABILITADOS EN TU LLAVE:\n(Toma una captura de esto)\n\n" + nombres;
            } else {
                resultadoDiv.style.color = "#ff4444";
                resultadoDiv.innerHTML = "ERROR AL LISTAR:\n" + JSON.stringify(data, null, 2);
            }
        } catch (error) {
            resultadoDiv.innerHTML = "Error de conexión: " + error.message;
        }
    }
</script>

</body>
</html>
