<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Remitos IA</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #e3f2fd; margin: 0;}
        .container { background: white; padding: 25px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        h2 { text-align: center; color: #1976d2; margin-top: 0;}
        button, input { width: 100%; padding: 12px; margin-top: 15px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;}
        #btn-analizar { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 1.1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        #btn-analizar:active { background: #218838; transform: translateY(1px); }
        #resultado { margin-top: 20px; padding: 15px; background: #f8f9fa; color: #333; min-height: 120px; border-radius: 8px; border: 1px solid #dee2e6; white-space: pre-wrap; font-size: 15px; line-height: 1.5;}
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Escáner de Remitos</h2>
    
    <!-- Tu API Key -->
    <input type="password" id="apiKey" placeholder="Pega aquí tu API Key de Gemini">
    
    <!-- Botón para abrir la cámara -->
    <input type="file" id="fotoRemito" accept="image/*" capture="environment">
    
    <button id="btn-analizar" onclick="procesarImagen()">Analizar Remito</button>

    <div id="resultado">Esperando la foto del remito...</div>
</div>

<script>
    async function procesarImagen() {
        const apiKey = document.getElementById('apiKey').value.trim(); 
        const fileInput = document.getElementById('fotoRemito');
        const resultadoDiv = document.getElementById('resultado');

        if (!apiKey || fileInput.files.length === 0) {
            alert("⚠️ Falta la API Key o la foto del remito.");
            return;
        }

        resultadoDiv.style.background = "#fff3cd";
        resultadoDiv.style.color = "#856404";
        resultadoDiv.innerHTML = "⏳ La Inteligencia Artificial está leyendo la imagen y calculando los cajones. Por favor, espera unos segundos...";

        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];

            const payload = {
                contents: [{
                    parts: [
                        { text: "Eres un asistente logístico. Analiza este remito de entrega. Extrae los nombres de los productos y sus cantidades originales. Si son empanadas, divide la cantidad original entre 30 para obtener los cajones. Si son burritos, divide la cantidad original entre 14 para obtener los cajones. Devuelve el resultado en una lista simple y clara, mostrando el nombre del producto y la cantidad final de cajones. No agregues texto extra ni explicaciones." },
                        { inline_data: { mime_type: file.type, data: base64Image } }
                    ]
                }]
            };

            try {
                // AHORA SÍ: Usamos gemini-2.5-flash tal cual te lo autorizó Google
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok && data.candidates && data.candidates.length > 0) {
                    resultadoDiv.style.background = "#d4edda";
                    resultadoDiv.style.color = "#155724";
                    resultadoDiv.innerHTML = "✅ **Lectura Completada:**\n\n" + data.candidates[0].content.parts[0].text;
                } else {
                    resultadoDiv.style.background = "#f8d7da";
                    resultadoDiv.style.color = "#721c24";
                    resultadoDiv.innerHTML = "❌ Hubo un error procesando la imagen. Intenta tomar la foto con mejor iluminación.\n\nDetalle técnico: " + (data.error ? data.error.message : "Error desconocido");
                }
            } catch (error) {
                resultadoDiv.style.background = "#f8d7da";
                resultadoDiv.style.color = "#721c24";
                resultadoDiv.innerHTML = "❌ Error de conexión. Revisa tu internet.\n" + error.message;
            }
        }
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
